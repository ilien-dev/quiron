name: branch-name

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Require feature/<descriptive-name>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^feature/[a-z0-9]+(-[a-z0-9]+)+$ ]]; then
            echo "Branch name OK: $HEAD_REF"
          else
            echo "::error::Branch '$HEAD_REF' must be named feature/<descriptive-name>: lowercase letters, digits and hyphens only, no uppercase or special characters, at least two words (e.g. feature/spanish-bands)."
            exit 1
          fi
